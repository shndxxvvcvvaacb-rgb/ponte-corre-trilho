<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corre Trilho - jogo de corrida infinita</title>
<meta name="description" content="Corre Trilho: jogo de corrida infinita no estilo Subway Surfers. Desvie dos trens, escolha seu personagem e mapa.">
<style>
:root{--ink:#fff4e0;--card:rgba(28,18,48,.88);--btn:#ff9f1c;--btnink:#2b1b3d;color-scheme:dark;box-sizing:border-box}
:root:not([data-theme="light"]){--ink:#fff4e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(28,18,48,.9)}}
:root[data-theme="dark"]{--card:rgba(28,18,48,.9)}
html,body{height:100%;margin:0;overflow:hidden;background:#1c1428;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;font-weight:800;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:20px;padding-top:max(14%,calc(env(safe-area-inset-top,0px) + 16px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
#ov[hidden]{display:none}.card{background:none;padding:0 0 24px;max-width:350px;width:100%;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.55)}
#mainc{touch-action:pan-y}#sb:empty{display:none}button{text-shadow:none}#fire{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:68px;height:68px;border-radius:50%;padding:0;font-size:30px;background:#ef476f;box-shadow:0 4px 0 #9b2243}#fire[hidden],#lbw[hidden]{display:none}#pg{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 50px);height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;pointer-events:none}#pgi{display:block;height:100%;width:0;background:#ffd166}#hud #sc,#pg{display:none}#tm{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);text-align:center;font-size:56px;font-weight:900;pointer-events:none}#tm.fz{opacity:.55}#mn{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.sm{font-size:15px;padding:10px 14px;background:#fff4e0}.sm.on{background:#ffd166}.sm:disabled{opacity:.6}#pnl{max-height:72vh;overflow-y:auto;touch-action:pan-y;width:min(92vw,360px);margin:0 auto}#pb.w{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #ffffff22;text-align:left}.row>:nth-child(2){flex:1}.row input{flex:none}.row.me{background:#ffd16633}h2{margin:12px 0}#wk{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;grid-template-columns:repeat(3,56px);gap:6px}#wk button{padding:0;height:56px;font-size:18px;background:#fff4e0cc}#wk button:first-child{grid-column:2}#wk[hidden],#fps[hidden]{display:none}#fps{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 80px);font-size:12px}

/* Estilos dos Botões de Rastros estilo imagem */
.tr-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.tr-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:16px;font-size:15px;font-weight:800;border:2px solid #e9cf84;background:#fffdf7;color:#3b2a0a;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:transform .12s,background .15s}
.tr-btn:active{transform:scale(.96)}
.tr-btn.on{background:linear-gradient(180deg,#f6cf65,#d8a128);color:#fff;border-color:#c9921c;box-shadow:0 3px 10px rgba(216,161,40,.45)}
.tr-btn:disabled{opacity:.65}
.tr-ico{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:radial-gradient(circle at 35% 35%,#d8dee9,#7b8794);color:#1f2933;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3)}

/* Aba Influenciadores e Cartões de Certificado */
.inf-wrap{background:#fdf9ed;background-image:radial-gradient(#e7dcc0 1.2px,transparent 1.2px);background-size:18px 18px;border:2px solid #e9cf84;border-radius:24px;padding:16px 14px;color:#2c1d05;text-shadow:none;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.inf-head{font-size:24px;font-weight:900;color:#221604;margin:4px 0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.inf-card{display:flex;align-items:center;gap:14px;background:rgba(249,244,228,.9);border:2px solid #c9ad4a;border-radius:18px;padding:12px 14px;margin-bottom:12px;text-align:left;box-shadow:0 2px 6px rgba(180,145,40,.12)}
.inf-card:last-child{margin-bottom:0}
.inf-badge{width:44px;height:44px;min-width:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4db5ff,#1b88e5);display:flex;align-items:center;justify-content:center;color:#112b45;font-size:24px;font-weight:900;box-shadow:0 2px 6px rgba(27,136,229,.35)}
.inf-info{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.inf-tag{font-size:10px;font-weight:800;letter-spacing:.9px;color:#6e6349;text-transform:uppercase}
.inf-name{font-size:20px;font-weight:900;color:#1e1404;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inf-date{font-size:13px;font-weight:600;color:#5c533c}

/* Tela de Conta (Criar conta & Entrar) */
#ac{background:#fffdf7;color:#3b2a0a;border:2px solid #e9cf84;border-radius:26px;padding:18px 16px;width:100%;box-sizing:border-box;max-height:88vh;overflow-y:auto;touch-action:pan-y;text-shadow:none;box-shadow:0 12px 32px rgba(0,0,0,.45)}
#ac h2{margin:0 0 12px;font-size:26px;font-weight:900;color:#2c1d05}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.tab{padding:10px 20px;border-radius:14px;font-size:15px;font-weight:800;border:1.5px solid #e5cb82;background:#fff;color:#3b2a0a;cursor:pointer;transition:all .15s}
.tab.active{background:linear-gradient(180deg,#f6cf65,#d8a128);color:#fff;border-color:#c9921c;box-shadow:0 2px 6px rgba(216,161,40,.35)}
#bn{height:105px;border-radius:20px;position:relative;margin-bottom:14px;border:1.5px solid #e9cf84;background-size:cover;overflow:hidden;background-color:#132a36}
#bn-white{position:absolute;left:0;right:0;bottom:0;height:36px;background:#fff}
#av{width:66px;height:66px;border-radius:50%;background:#777 center/cover;color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;border:4px solid #fff;position:absolute;left:14px;bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.r2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
label.sm{font-weight:800;border-radius:14px;cursor:pointer;background:#fff;border:1.5px solid #e9cf84;color:#3b2a0a;padding:9px 14px;font-size:14px}
#sws{display:flex;gap:10px;justify-content:center;margin:14px 0}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid #e9cf84;cursor:pointer;transition:transform .12s}
.sw.sel{transform:scale(1.12);border:3px solid #3b2a0a}
.inp-ac{width:100%;box-sizing:border-box;padding:14px;border:1.5px solid #e9cf84;border-radius:18px;font-size:16px;text-align:center;background:#fff;color:#3b2a0a;margin-top:10px;outline:none}
.inp-ac:focus{border-color:#d8a128;box-shadow:0 0 0 3px rgba(216,161,40,.2)}
#er{color:#c0392b;min-height:1.3em;margin:8px 0 4px;font-size:14px;font-weight:700}
#mk{width:100%;padding:14px;border-radius:18px;font-size:18px;font-weight:900;background:linear-gradient(180deg,#f6cf65,#d8a128);color:#fff;border:0;box-shadow:0 3px 8px rgba(216,161,40,.4);margin-top:4px}
#ac .sm-link{background:none;border:0;color:#7a6236;font-size:14px;font-weight:700;padding:8px 14px;margin-top:6px;text-decoration:underline}

.av{width:28px;height:28px;border-radius:50%;object-fit:cover}
#pf{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:16px;margin-bottom:12px;font-weight:800;justify-content:space-between;color:#fff;background-size:cover;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#pf-left{display:flex;align-items:center;gap:8px}
#pf-out{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer}
#pf[hidden],#ac[hidden]{display:none}#ov.a{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}#wk,#fire{display:none!important}#rk{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:68px;height:68px;border-radius:50%;padding:0;font-size:32px;line-height:1;background:radial-gradient(circle,#4a94ff 0 57%,transparent 59%),conic-gradient(#ffd166 var(--p,360deg),rgba(255,255,255,.2) 0);box-shadow:0 5px 0 #1d4fa8,0 0 22px rgba(58,134,255,.6);z-index:5;animation:rkp .8s ease-in-out infinite}@keyframes rkp{50%{transform:scale(1.09)}}#rk[hidden],#rkt[hidden]{display:none}#rkt{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 128px);text-align:center;font-size:22px;font-weight:900;color:#ffd166;text-shadow:0 2px 0 rgba(0,0,0,.5);pointer-events:none}#cn{background:rgba(235,230,225,.92);color:#3b2a0a;border-radius:16px;padding:6px 16px;text-shadow:none}#cd,.ai{width:100%;box-sizing:border-box;padding:12px;border:2px solid #e9cf84;border-radius:18px;font-size:16px;text-align:center;background:#fff;color:#3b2a0a;margin-top:10px}#cm{min-height:1.2em;margin-top:8px;font-size:14px}#lbt{margin-top:18px;font-weight:800;color:#ffd166}#lb{list-style:none;margin:8px auto 0;padding:0;font-size:14px;max-width:300px;max-height:28vh;overflow-y:auto;touch-action:pan-y;text-align:left}#lb li{display:flex;justify-content:space-between;gap:12px;padding:2px 0}

/* Top global estilo foto */
.lb-wrap{background:#fdf9ed;background-image:radial-gradient(#e7dcc0 1.2px,transparent 1.2px);background-size:18px 18px;border:2px solid #e9cf84;border-radius:24px;padding:16px 12px;color:#1e1404;text-shadow:none;box-shadow:0 10px 28px rgba(0,0,0,.42)}
.lb-head{font-size:24px;font-weight:900;color:#1e1404;margin:2px 0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.lb-list{background:rgba(255,253,247,.72);border:1.5px solid #e2c97a;border-radius:20px;padding:4px 10px;max-height:58vh;overflow-y:auto;touch-action:pan-y}
.lb-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ece3c6;text-align:left}
.lb-item:last-child{border-bottom:0}
.lb-item.me{background:rgba(246,207,101,.22);border-radius:12px}
.lb-pos{width:34px;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#1e1404;line-height:1}
.lb-crown{font-size:11px;line-height:1;margin-bottom:2px}
.lb-medal{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.lb-m1{background:linear-gradient(180deg,#ffd43b,#d99b00)}
.lb-m2{background:linear-gradient(180deg,#ced4da,#868e96)}
.lb-m3{background:linear-gradient(180deg,#e59866,#a04000)}
.lb-av{width:38px;height:38px;min-width:38px;border-radius:50%;object-fit:cover;background:#8a8e93;color:#fff;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.lb-nm{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:16px;font-weight:800;color:#1e1404;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-chk{color:#757575;font-size:16px;font-weight:900;flex-shrink:0}
.lb-tm{font-size:16px;font-weight:900;color:#181105;font-variant-numeric:tabular-nums;white-space:nowrap}
#tm{text-shadow:0 0 16px rgba(255,209,102,.65),0 3px 0 rgba(0,0,0,.45);letter-spacing:1px}
#mainc{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;animation:cin .45s cubic-bezier(.2,.9,.3,1.2) both}@keyframes cin{from{opacity:0;transform:translateY(18px) scale(.97)}}
#ov:not(.a){padding-top:calc(env(safe-area-inset-top,0px) + 14px);background:radial-gradient(ellipse at 50% 30%,rgba(10,0,25,0),rgba(10,0,25,.38))}
#mainc h1{margin:2px 0 4px;font:900 min(10vw,46px)/1.05 ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:1px;text-shadow:3px 4px 0 #d94f5c,0 10px 22px rgba(0,0,0,.45)}
#hs{margin:0 0 4px;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 12px rgba(0,0,0,.5)}
#mainc #sb{font-size:17px;font-weight:800;margin:0 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#mainc #pf{justify-content:center;gap:6px;background:none!important;box-shadow:none;padding:0;margin:0 0 2px;font-size:20px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#mainc #pf-left{gap:6px}
#mainc #pf-out{background:none;border:0;border-radius:0;padding:0;font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#spin{height:clamp(150px,27vh,240px)}
#mainc button{transition:transform .12s,filter .12s}#mainc button:active{transform:scale(.96)}
#mainc #go{display:block;width:max-content;min-width:64%;max-width:100%;margin:0 auto 16px;padding:14px 22px;font:900 min(8vw,32px)/1.1 ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#0c0824;background:#7ddc8c;border:5px solid #0c0824;border-radius:30px;box-shadow:0 7px 0 #0c0824;animation:gop 1.6s ease-in-out infinite}@keyframes gop{50%{transform:scale(1.04)}}
#mainc #mn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:0}
#mainc #mn>button:first-child,#mainc #mn:has(#btn-conta[hidden])>button[data-s="cf"]{grid-column:1/-1}
#mainc #mn .sm,#mainc #uc{padding:15px 6px;font:900 min(3.5vw,14px)/1.1 ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:#786af6;border:4px solid #0c0824;border-radius:22px;box-shadow:0 6px 0 #0c0824;text-shadow:none}
#mainc #mn>button:first-child{font-size:min(4.4vw,17px);letter-spacing:1.5px}
#hint{margin:16px 0 8px;font-size:15px;font-weight:800;line-height:1.35;color:#fff;opacity:.92;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.5)}
#mainc #cd{margin-top:6px;border:4px solid #0c0824;border-radius:22px;padding:12px;font:800 16px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;color:#0c0824;background:#fff;box-shadow:0 5px 0 #0c0824}
#mainc #uc{display:block;width:100%;margin-top:14px;font-size:16px;letter-spacing:1.5px;background:#7ddc8c;color:#0c0824}
p{margin:0 0 18px;font-size:15px;line-height:1.45}
button{font:800 18px system-ui,sans-serif;background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:13px 34px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.inf-pill{display:inline-block;margin-left:6px;background:#ffe27a;color:#3b2a0a;font-weight:900;font-size:11px;letter-spacing:.5px;padding:2px 9px;border-radius:999px;box-shadow:0 0 10px rgba(255,200,60,.85);vertical-align:middle}
.pd-av{width:56px;height:56px;border-radius:50%;margin:0 auto 4px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;background:#8a8e93;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pd-av img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== MODO STREAM ===== */
#stbtn{display:block;width:100%;margin-top:14px;padding:15px 6px;font:900 16px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:#e5304d;border:4px solid #0c0824;border-radius:22px;box-shadow:0 6px 0 #0c0824;text-shadow:none}
#stbtn:active{transform:scale(.96)}
#stmbar{margin-top:10px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#stmbar:empty{display:none}
#stmlive{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(20,10,30,.8);font:900 15px system-ui,sans-serif;color:#fff;pointer-events:none;text-shadow:none}
#stmlive[hidden],#stmtest[hidden]{display:none}
.stm-dot{display:inline-block;width:12px;height:12px;min-width:12px;border-radius:50%;background:#ff2d4a;box-shadow:0 0 10px #ff2d4a;animation:stmb 1s ease-in-out infinite}
.stm-dot.off{background:#9aa0b5;box-shadow:none;animation:none}
@keyframes stmb{50%{opacity:.25}}
#stmfeed{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:60;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:72vw}
.stm-it{background:rgba(20,10,30,.8);color:#fff;font:800 13px system-ui,sans-serif;padding:5px 10px;border-radius:10px;text-shadow:none}
#stmtest{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:60;display:flex;flex-direction:column;gap:6px}
#stmtest button{padding:0;width:44px;height:44px;font-size:18px;border-radius:50%;background:#fff4e0cc}
.stm-box{background:rgba(255,253,247,.12);border:1.5px solid rgba(233,207,132,.55);border-radius:18px;padding:12px;margin-bottom:12px;text-align:left;font-size:14px;font-weight:700;line-height:1.35}
.stm-box h3{margin:0 0 8px;font-size:16px}
.stm-box input,.stm-box select{width:100%;box-sizing:border-box;padding:10px;border:2px solid #e9cf84;border-radius:14px;font-size:15px;background:#fff;color:#3b2a0a;margin-top:6px;text-shadow:none;font-weight:700}
.stm-rule{background:rgba(0,0,0,.22);border-radius:14px;padding:8px;margin-bottom:8px}
.stm-row{display:flex;gap:6px;align-items:center}
.stm-row+.stm-row{margin-top:6px}
.stm-row>select,.stm-row>input{flex:1;min-width:0;margin-top:0}
.stm-row>button{flex:none;padding:8px 12px}
.stm-st{font-size:18px;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.stm-msg{margin-top:6px;text-align:center;color:#ffd166}
.stm-act{display:block;width:100%;margin:8px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0</span><span id="tm">⏱ 0.0s</span><span id="cn">🪙 0</span></div>
<div id="pg"><i id="pgi"></i></div>
<div id="ov"><div class="card">
  <div id="mainc">
    <h1 id="tt">Corre Trilho</h1>
    <p id="hs"></p>
    <div id="pf" hidden><div id="pf-left"></div><button id="pf-out">· sair</button></div>
    <p id="sb"></p>
    <div id="tn"></div>
    <div id="spin"></div>
    <button id="go">Jogar</button>
    <div id="mn">
      <button class="sm" data-s="lb">Top global</button>
      <button class="sm" data-s="ch">Personagens</button>
      <button class="sm" data-s="tr">Rastros</button>
      <button class="sm" data-s="mp">Mapas</button>
      <button class="sm" data-s="inf">Influencers</button>
      <button class="sm" data-s="cf">Configurações</button>
      <button class="sm" id="btn-conta">Conta</button>
    </div>
    <p id="hint">A/D ou ←/→ mover · W/↑/Espaço pular · S/↓ deslizar · R foguete 🚀<br>No Coin: quanto mais tempo sem pegar moeda, melhor.</p>
    <input id="cd" placeholder="Digite um código" autocomplete="off" maxlength="16">
    <button id="uc" class="sm" style="margin-top:10px">Usar código</button>
    <div id="cm"></div>

<script>(()=>{

function coinArc(l,z){const H5=[.3,.9,1.25,.9,.3];for(let i=0;i<5;i++)objs.push({t:'coin',l,z:z-6.4+i*3.2,h:H5[i]})}
const ZS=900,ZR=3000;

let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function sweep(a,T,f0,f1,dur,peak,q,pan){
  const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=b;
  const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=q;
  f.frequency.setValueAtTime(f0,T);f.frequency.exponentialRampToValueAtTime(f1,T+dur);
  const g=a.createGain();g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(peak,T+dur*.22);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  let out=g;
  if(a.createStereoPanner&&pan){const p=a.createStereoPanner();p.pan.value=pan;g.connect(p);out=p}
  src.connect(f);f.connect(g);out.connect(a.destination);src.start(T);src.stop(T+dur);
}
function tone(a,T,f0,f1,dur,peak,type){
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(f1,T+dur);
  g.gain.setValueAtTime(peak,T);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+dur+.02);
}
function sfx(k,d){
  if(G.mute)return;const nw=performance.now();if(nw-(sfxT[k]||0)<(k==='coin'?30:90))return;sfxT[k]=nw;const a=ac();if(!a)return;const T=a.currentTime;
  try{
    if(k==='swoosh')sweep(a,T,d>0?500:2400,d>0?2400:500,.17,.9,1.2,(d||0)*.7);
    else if(k==='jump'){sweep(a,T,350,1900,.22,.8,.9,0);tone(a,T,260,520,.12,.08,'sine')}
    else if(k==='roll')sweep(a,T,1900,320,.24,.8,.9,0);
    else if(k==='bump'){tone(a,T,120,60,.1,.22,'sine');sweep(a,T,300,150,.08,.35,.8,(d||0)*.5)}
    else if(k==='coin'){tone(a,T,988,988,.07,.12,'square');tone(a,T+.07,1319,1319,.16,.12,'square')}
    else if(k==='rocket'){sweep(a,T,150,1500,.7,1.1,.7,0);tone(a,T,80,320,.6,.15,'sawtooth')}
    else if(k==='crash'){tone(a,T,170,35,.45,.55,'sine');sweep(a,T,1200,120,.5,1.2,.5,0)}
  }catch(e){}
}
let stepT=0,stepDir=0;
function move(d){if(st!=='play')return;const nl=Math.max(-1,Math.min(1,lane+d));if(nl!==lane){lane=nl;stepT=.3;stepDir=d;sfx('swoosh',d)}else sfx('bump',d)}
function jump(){if(st!=='play'||rk>0)return;if((jv===0&&Math.abs(jh-SUP)<.02)||(coy>0&&jv<=0)){jv=11;jh=Math.max(jh,SUP)+.001;coy=0;jbuf=0;slide=0;sfx('jump')}else jbuf=.14}
function down(){if(st==='play'&&rk<=0){if(slide>0)return;slide=.6;if(jh>SUP+.02)jv=-14;sfx('roll')}}

let tx=0,ty=0;document.body.style.touchAction='none';addEventListener('contextmenu',e=>{if(st==='play')e.preventDefault()});

addEventListener('touchcancel',e=>{for(const c of e.changedTouches)delete TCH[c.identifier]},{passive:true});
function win(){st='win';$('fire').hidden=true;$('rk').hidden=true;rk=0;saveTime();$('tt').textContent='Moeda! '+elapsed.toFixed(1)+'s';$('sb').textContent=(db&&uid)?'Seu tempo foi enviado ao Top global.':'Tempo salvo localmente!';$('go').textContent='Jogar de novo';$('ov').hidden=false}
function rocket(){if(st!=='play'||rkUsed||rk>0||rkW<=0)return;rkUsed=true;rkW=0;rk=RKT;$('rk').hidden=true;sfx('rocket')}
function fire(){if(st!=='play'||cd>0)return;cd=.6;shots.push({l:Math.round(px),z:1})}
function moveShots(dt){for(const s of shots){s.z+=70*dt;for(const o of objs){if(o.dead||o.t==='coin'||o.t==='goal'||o.l!==s.l)continue;const hit=o.t==='train'?(s.z>=o.z&&s.z<=o.z+TL):Math.abs(s.z-o.z)<1;if(hit){o.dead=1;s.dead=1;kills++;break}}}shots=shots.filter(s=>!s.dead&&s.z<75)}
function drawShots(){for(const s of shots){const p=P(s.z,s.l),r=p.u*.14,y=p.y-p.u*.7;ctx.fillStyle='rgba(255,159,28,.45)';ctx.beginPath();ctx.arc(p.x,y,r*1.8,0,7);ctx.fill();ball(p.x,y,r,'#8d99ae','#1b1b2b')}}
const fmt=s=>{const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+(s-m*60).toFixed(2).padStart(5,'0')},fmt2=s=>s<60?s.toFixed(2):fmt(s);

let G={coins:0,xp:0,sk:[0,20,23],skin:23,tr:[0],trail:0,map:0,wasd:true,fps:false,coin:'#ffd166',bt:0,trailImg:'',customTrails:[],canPhotoTrail:false};
try{Object.assign(G,JSON.parse(localStorage.getItem('ct-g')||'{}'))}catch(e){}
if(!G.sk.includes(23))G.sk.push(23);
if(!Array.isArray(G.tr))G.tr=[0];
if(G.trail==null)G.trail=0;

/* === RASTROS (INCLUINDO OS DA IMAGEM + EXTRAS + 3 RASTROS EXCLUSIVOS DE CÓDIGO ADM: NEYMAR, ROBLOX, LIVE TTK) === */
const TRS=[
  {id:'none',    n:'Nenhum',      ico:'○',  p:0},
  {id:'smoke',   n:'Fumaça',      ico:'☁',  p:150},
  {id:'fire',    n:'Fogo',        ico:'🔥', p:300},
  {id:'ice',     n:'Gelo',        ico:'❄',  p:400},
  {id:'neon',    n:'Neon',        ico:'⚡', p:500},
  {id:'rain',    n:'Arco-íris',   ico:'🌈', p:700},
  {id:'leaf',    n:'Folha',       ico:'🍃', p:220},
  {id:'paw',     n:'Animal',      ico:'🐾', p:350},
  {id:'star',    n:'Estrela',     ico:'⭐', p:450},
  {id:'heart',   n:'Coração',     ico:'💖', p:280},
  {id:'bub',     n:'Bolhas',      ico:'🫧', p:200},
  {id:'neymar',  n:'Neymar',      ico:'⚽', p:9999, x:1},
  {id:'roblox',  n:'Roblox',      ico:'🧱', p:9999, x:1},
  {id:'livettk', n:'Live ttk',    ico:'🎵', p:9999, x:1},
  {id:'photo',   n:'Minha Foto',  ico:'📷', p:0}
];

const trailImages={};
function getTrailImgObj(src){
  if(!src)return null;
  if(!trailImages[src]){
    const im=new Image();
    im.src=src;
    trailImages[src]={img:im,ready:false};
    im.onload=()=>{trailImages[src].ready=true};
  }
  return trailImages[src].ready?trailImages[src].img:null;
}

function getActiveTrailInfo(){
  {const _k=SKS[G.skin];if(_k&&_k.fx)return {id:_k.fx,n:'Coração',imgSrc:''}}
  if(G.trail>=0 && TRS[G.trail]){
    const tObj=TRS[G.trail];
    return {id:tObj.id, n:tObj.n, imgSrc:(tObj.id==='photo'?G.trailImg:tObj.imgSrc)||''};
  }
  if(G.trail<0 && Array.isArray(G.customTrails)){
    const idx=-(G.trail+1);
    const ct=G.customTrails[idx];
    if(ct)return {id:'photo', n:ct.n||'Foto', imgSrc:ct.imgSrc||''};
  }
  return {id:'none', n:'Nenhum', imgSrc:''};
}

function spawnTrails(dt){
  if(G.noTrail){trails.length=0;return}
  const active=getActiveTrailInfo();
  const tid=active.id;
  if(tid==='none')return;
  const rate=st==='play'?Math.min(1,dt*30):dt*12;
  if(Math.random()<rate&&trails.length<70){
    // Para Neymar, sai bem perto dos pés (h próximo de jh ou SUP), alternando pé esquerdo e direito
    const isFootTrail=(tid==='neymar');
    const footSide=(Math.random()<.5?-1:1)*.18;
    const spread=isFootTrail?footSide:(Math.random()-.5)*.45;
    const hOff=isFootTrail?(jh+.04):(jh+(Math.random()-.3)*.35);
    const hasPhoto=(tid==='photo'||!!active.imgSrc);
    trails.push({
      id:hasPhoto?'photo':tid,
      imgSrc:hasPhoto?active.imgSrc:'',
      l:px+spread,
      z:0.15+Math.random()*.35,
      h:Math.max(0.02,hOff),
      life:0,
      maxLife:isFootTrail?.55+.25*Math.random():.45+Math.random()*.35,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-.5)*6,
      hue:(t*220+trails.length*25)%360,
      sz:.8+Math.random()*.5
    });
  }
  for(const pt of trails){
    pt.life+=dt;
    pt.rot+=pt.vr*dt;
    if(st==='play')pt.z-=speed*.35*dt;
    if(pt.id==='smoke'||pt.id==='bub')pt.h+=.6*dt;
    if(pt.id==='leaf')pt.l+=Math.sin(t*8+pt.rot)*.25*dt;
    if(pt.id==='neymar')pt.h+=.12*dt;
  }
  trails=trails.filter(pt=>pt.life<pt.maxLife&&pt.z>-2);
}

function drawTrails(){
  for(const pt of trails){
    const p=P(pt.z,pt.l);
    const alpha=Math.max(0,1-(pt.life/pt.maxLife));
    const u=p.u*pt.sz;
    const x=p.x;
    const y=p.y-pt.h*p.u;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.rotate(pt.rot);
    if(pt.id==='smoke'){
      const g=ctx.createRadialGradient(0,0,u*.02,0,0,u*.22);
      g.addColorStop(0,'rgba(235,235,245,.9)');
      g.addColorStop(1,'rgba(150,150,170,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,u*.22,0,7);ctx.fill();
    }else if(pt.id==='fire'){
      const g=ctx.createRadialGradient(0,0,u*.02,0,0,u*.22);
      g.addColorStop(0,'#fff3a1');g.addColorStop(.5,'#ff7b00');g.addColorStop(1,'rgba(230,30,10,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,u*.22,0,7);ctx.fill();
    }else if(pt.id==='ice'){
      ctx.strokeStyle='#a8ecff';ctx.lineWidth=Math.max(1.5,u*.03);
      for(let k=0;k<3;k++){
        ctx.beginPath();ctx.moveTo(-u*.14,0);ctx.lineTo(u*.14,0);ctx.stroke();
        ctx.rotate(Math.PI/3);
      }
    }else if(pt.id==='neon'){
      ctx.shadowColor='#00f7ff';ctx.shadowBlur=10;
      ctx.fillStyle='#00f7ff';ctx.beginPath();ctx.arc(0,0,u*.11,0,7);ctx.fill();
    }else if(pt.id==='rain'){
      ctx.fillStyle='hsl('+pt.hue+',100%,60%)';
      ctx.beginPath();ctx.arc(0,0,u*.14,0,7);ctx.fill();
    }else if(pt.id==='leaf'){
      ctx.fillStyle='#4cd964';ctx.strokeStyle='#1f7a32';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(0,0,u*.16,u*.08,0,0,7);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-u*.14,0);ctx.lineTo(u*.14,0);ctx.stroke();
    }else if(pt.id==='paw'){
      ctx.fillStyle='#d49a6a';
      ctx.beginPath();ctx.ellipse(0,u*.04,u*.09,u*.07,0,0,7);ctx.fill();
      for(const ox of[-u*.08,0,u*.08]){
        ctx.beginPath();ctx.arc(ox,-u*.05,u*.038,0,7);ctx.fill();
      }
    }else if(pt.id==='star'){
      ctx.fillStyle='#ffd166';
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const rad=i%2===0?u*.16:u*.07;
        const ang=i*Math.PI/5;
        if(i===0)ctx.moveTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
        else ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
      }
      ctx.closePath();ctx.fill();
    }else if(pt.id==='heart'){
      ctx.fillStyle='#ff4d8d';
      const s=u*.12;
      ctx.beginPath();
      ctx.moveTo(0,s*.8);
      ctx.bezierCurveTo(-s*1.4,-s*.3,-s*.7,-s*1.2,0,-s*.4);
      ctx.bezierCurveTo(s*.7,-s*1.2,s*1.4,-s*.3,0,s*.8);
      ctx.fill();
    }else if(pt.id==='bub'){
      ctx.strokeStyle='rgba(190,240,255,.9)';ctx.fillStyle='rgba(160,225,255,.25)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,u*.12,0,7);ctx.fill();ctx.stroke();
    }else if(pt.id==='neymar'||pt.id==='roblox'||pt.id==='livettk'){
      // Rastro com o próprio nome aparecendo na pista (Neymar saindo no pé, Roblox, Live ttk)
      ctx.rotate(-pt.rot*.2);
      const label=pt.id==='neymar'?'Neymar':pt.id==='roblox'?'roblox':'Live ttk';
      const fs=Math.max(10,Math.min(26,u*.22));
      ctx.font='900 '+fs+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.lineWidth=Math.max(2.5,fs*.18);
      ctx.lineJoin='round';
      if(pt.id==='neymar'){
        ctx.strokeStyle='#0b2b18';
        ctx.strokeText(label,0,0);
        ctx.fillStyle='#ffd60a';
        ctx.fillText(label,0,0);
      }else if(pt.id==='roblox'){
        ctx.strokeStyle='#0f172a';
        ctx.strokeText(label,0,0);
        ctx.fillStyle='#ffffff';
        ctx.fillText(label,0,0);
      }else{
        ctx.shadowColor='#ff0050';ctx.shadowBlur=8;
        ctx.strokeStyle='#111827';
        ctx.strokeText(label,0,0);
        ctx.shadowColor='#00f2ea';ctx.shadowBlur=8;
        ctx.fillStyle='#ffffff';
        ctx.fillText(label,0,0);
        ctx.shadowBlur=0;
      }
    }else if(pt.id==='photo'){
      const im=getTrailImgObj(pt.imgSrc);
      const sz=Math.max(14,u*.34);
      if(im){
        ctx.save();
        ctx.beginPath();
        ctx.arc(0,0,sz*.55,0,Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(im,-sz*.55,-sz*.55,sz*1.1,sz*1.1);
        ctx.restore();
        ctx.strokeStyle='#ffd166';
        ctx.lineWidth=Math.max(1.5,u*.025);
        ctx.beginPath();
        ctx.arc(0,0,sz*.55,0,Math.PI*2);
        ctx.stroke();
      }else{
        ctx.fillStyle='#ffd166';
        ctx.beginPath();
        ctx.arc(0,0,sz*.4,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

    const k=(y0-hz)/(H-hz),x=W/2+sd*(W*.18+fx*W*.34)*(.25+k*1.2),r=(3+k*18)*(.6+(i%3)*.25);
    ctx.globalAlpha=.25+.3*Math.sin(t*3+i);ctx.fillStyle=i%3?'#ffb02e':'#ffe27a';

  }

$('mk').onclick=async()=>{
  const n=$('nm').value.trim(),p=$('pw').value,er=$('er');

  if(p.length<(cloud?6:3)){er.textContent='A senha precisa ter pelo menos '+(cloud?6:3)+' caracteres.';return}

      if(authMode==='register'){
        let cred;
        try{cred=await auth.createUserWithEmailAndPassword(mailOf(key),p)}
        catch(e){er.textContent=(e&&e.code==='auth/email-already-in-use')?'O nome "'+n+'" já está em uso! Escolha outro nome.':authErr(e);return}
        const pub={name:n,uid:cred.user.uid,bc:A.bc,banner:A.banner,avatar:A.avatar,G:JSON.parse(JSON.stringify(G))};

        uid=cred.user.uid;PF=pub;paint();home();
      }else{
        let cred;
        try{cred=await auth.signInWithEmailAndPassword(mailOf(key),p)}catch(e){er.textContent=authErr(e);return}
        uid=cred.user.uid;
        const sn=await db.doc('names/'+key).get();

        PF=sn.data();mergeG(PF.G);paint();home();syncClaims();checkAdminBtn();
      }
    }catch(e){er.textContent='Erro: '+((e&&(e.code||e.message))||'desconhecido')}
    finally{authBusy=false}
    return;
  }
  // modo local (sem servidor): senha guardada só como hash
  const accs=getLocalAccounts(),ph=await hashPw(key,p);
  if(authMode==='register'){
    if(accs[key]){er.textContent='O nome "'+n+'" já existe! Use outro nome ou clique em Entrar.';return}

    accs[key]=acc;saveLocalAccounts(accs);
    try{localStorage.setItem('ct-current-user',key)}catch(e){}
    PF=acc;paint();home();
  }else{
    const acc=accs[key];
    if(!acc){er.textContent='Conta não encontrada. Verifique o nome ou crie uma conta.';return}
    if(acc.ph?acc.ph!==ph:acc.pass!==p){er.textContent='Nome ou senha incorretos.';return}

    try{localStorage.setItem('ct-current-user',key)}catch(e){}
    paint();home();
  }
};

function localRedeem(c){
  const L=lc(),d=L.codes[c];
  if(!d){cmsg('Código inválido.');return}
  if(L.mine.includes(c)){cmsg('Você já usou este código.');return}
  if((d.used||0)>=d.max){cmsg('Código esgotado.');return}
  d.used=(d.used||0)+1;L.mine.push(c);slc(L);
  applyReward({type:d.type||'skin',itemId:d.itemId!=null?d.itemId:d.skin,unlockPhoto:!!d.unlockPhoto,imgSrc:d.imgSrc||'',label:d.label||''});
  $('cd').value='';

async function redeemSharedCode(c){
  if(!db){localRedeem(c);return}
  if(!(auth&&auth.currentUser)){cmsg('Entre na sua conta para usar códigos.');return}
  const codeRef=db.doc('codes/'+c),claimRef=db.doc('claims/'+auth.currentUser.uid);
  let x=null;
  try{
    await db.runTransaction(async tx=>{
      const cs=await tx.get(codeRef);
      if(!cs.exists)throw new Error('invalid');
      const d=cs.data(),used=d.used||0;
      if(used>=Number(d.max||1))throw new Error('full');
      const ms=await tx.get(claimRef),mine=ms.exists?(ms.data().c||[]):[];
      if(mine.includes(c))throw new Error('dup');
      tx.update(codeRef,{used:used+1});
      tx.set(claimRef,{c:mine.concat(c)});
      x=d;
    });
  }catch(e){
    const m=String((e&&e.message)||'');
    if(m==='invalid'){cmsg('Código inválido.');return}
    if(m==='full'){cmsg('Código esgotado.');return}
    if(m==='dup'){cmsg('Você já usou este código.');return}
    throw e;
  }
  applyReward({type:x.type||'skin',itemId:x.itemId!=null?x.itemId:x.skin,unlockPhoto:!!x.unlockPhoto,imgSrc:x.imgSrc||'',label:x.label||''});
  $('cd').value='';
}

// coloca o efeito na pista (aparece no horizonte, igual aos obstáculos normais)
function stmSpawn(fx,n){
  if(st!=='play')return false;
  const ls=[-1,0,1].sort(()=>Math.random()-.5).slice(0,Math.min(3,Math.max(1,n))),len=fx==='train'?TL:fx==='coin'?4:1;
  const clash=z=>objs.some(o=>{
    if(o.dead)return false;const same=ls.includes(o.l);if(!same&&o.t==='coin')return false;
    const m=same?4:9,ol=o.t==='train'?TL:0;return o.z-m<z+len&&o.z+ol+m>z});
  let z=68,ok=false;
  for(let i=0;i<24;i++,z+=5){if(!clash(z)){ok=true;break}}
  if(!ok)return false;
  for(const l of ls){
    if(fx==='coin'){for(let i=0;i<2;i++)objs.push({t:'coin',l,z:z+i*3.2})}
    else if(fx==='train')objs.push({t:'train',l,z,v:Math.random()<.6?0:1});
    else if(fx==='low')objs.push({t:'low',l,z,v:Math.random()*3|0});
    else objs.push({t:'high',l,z});
  }
  return true;
}

// chegou um presente
function stmGift(name,count,user){
  if(!stmLive)return;
  name=String(name||'').slice(0,40);user=String(user||'').slice(0,30);
  count=Math.max(1,Math.min(5,parseInt(count,10)||1));
  const k=stmNorm(name),r=k?STM.rules.find(x=>x.g&&stmNorm(x.g)===k):null;
  try{window.dispatchEvent(new CustomEvent('ct-gift',{detail:{gift:name,count,user,rule:r||null}}))}catch(e){}
  stmFeed((user?'@'+user+' ':'')+'mandou '+name+(count>1?' x'+count:'')+(r?' → '+STM_FX[r.fx][0]+' '+r.n:''));
  if(!r||st!=='play')return;
  for(let i=0;i<count&&stmQ.length<12;i++)stmQ.push({fx:r.fx,n:r.n,tr:0});
}

function stmUI(){
  $('stmlive').hidden=!stmLive;

function stmLoop(){
  if(!stmLive)return;
  const left=stmEnd-Date.now();
  if(left<=0){stmFinish('Acabaram os '+STM.min+' minutos da live.');return}
  $('stmlt').textContent='AO VIVO · '+stmMS(left);
  const cd=$('stm-cd');if(cd)cd.textContent='AO VIVO · termina em '+stmMS(left);
  const bt=$('stmbt');if(bt)bt.textContent=stmBarTxt();
  if(st!=='play'){stmQ.length=0;return}
  if(stmQ.length&&Date.now()-stmLastSp>1800){
    const q=stmQ[0];
    if(stmSpawn(q.fx,q.n)){stmQ.shift();stmLastSp=Date.now()}else if(++q.tr>60)stmQ.shift();
  }
}
function stmClose(){
  const w=stmWs;stmWs=null;
  if(w){try{w.onopen=w.onclose=w.onerror=w.onmessage=null;if(w.readyState===1)w.send(JSON.stringify({cmd:'disconnect'}));w.close()}catch(e){}}
}
function stmGoLive(){
  stmLive=true;stmSt='live';stmMsg='';stmEnd=Date.now()+STM.min*60000;stmQ=[];stmLastSp=0;
  clearInterval(stmTick);stmTick=setInterval(stmLoop,250);
  stmUI();
}
function stmFail(msg){stmClose();clearInterval(stmTick);stmLive=false;stmSt='err';stmMsg=msg;stmUI()}
function stmFinish(msg){stmClose();clearInterval(stmTick);stmLive=false;stmSt='ended';stmMsg=msg;stmQ=[];stmUI()}
function stmStop(){stmClose();clearInterval(stmTick);stmOn=false;stmLive=false;stmDemo=false;stmSt='idle';stmMsg='';stmQ=[];stmUI()}
function stmStart(demo){
  const u=STM.user;
  if(!demo&&!/^[A-Za-z0-9_.]{2,24}$/.test(u)){stmMsg='Digite o @ do TikTok primeiro.';stmUI();return}
  stmClose();clearInterval(stmTick);stmOn=true;stmLive=false;stmQ=[];stmMsg='';
  if(demo){stmDemo=true;stmGoLive();return}
  stmDemo=false;stmSt='wait';stmMsg='Entrando na live de @'+u+'…';stmUI();
  let ws;
  try{ws=new WebSocket(STM.url)}catch(e){stmFail('Endereço da ponte inválido ou bloqueado pelo navegador.');return}
  stmWs=ws;
  const to=setTimeout(()=>{if(stmWs===ws&&stmSt==='wait')stmFail('A live não respondeu em 20 segundos. O @'+u+' está ao vivo agora?')},20000);
  ws.onopen=()=>{try{ws.send(JSON.stringify({cmd:'connect',username:u}))}catch(e){}};
  ws.onmessage=ev=>{
    let d;try{d=JSON.parse(ev.data)}catch(e){return}
    if(!d||stmWs!==ws)return;
    if(d.type==='live'){clearTimeout(to);if(!stmLive)stmGoLive()}
    else if(d.type==='gift')stmGift(d.gift,d.count,d.user);
    else if(d.type==='error'){clearTimeout(to);stmFail(String(d.msg||'Não consegui entrar na live.').slice(0,200))}
    else if(d.type==='end'){clearTimeout(to);stmFinish('A live terminou.')}
  };
  ws.onclose=()=>{
    clearTimeout(to);if(stmWs!==ws)return;
    if(stmSt==='wait')stmFail('Não achei a ponte em '+STM.url+'. A ponte está desligada ou o endereço está errado. Tente de novo ou use "Testar sem TikTok".');
    else if(stmLive)stmFinish('Perdi a conexão com a ponte.');
  };
}

  stmBar();
  if(!$('mainc').hidden)stmPanel();
  return true;
}

  const custom=!STM_PRE.some(p=>p[0]===r.g);
  const sel=el('select');
  STM_PRE.forEach(p=>{const o=el('option',p[1]);o.value=p[0];sel.append(o)});
  const oc=el('option','✏️ Outro (digitar o nome)');oc.value='__c';sel.append(oc);
  sel.value=custom?'__c':r.g;
  const ci=el('input');ci.placeholder='Nome do presente (ex: Rose)';ci.maxLength=30;ci.value=custom?r.g:'';ci.hidden=!custom;ci.style.marginTop='6px';
  sel.onchange=()=>{if(sel.value==='__c'){ci.hidden=false;r.g=ci.value.trim();ci.focus()}else{ci.hidden=true;r.g=sel.value}stmSave()};
  ci.oninput=()=>{r.g=ci.value.trim();stmSave()};
  const del=el('button','🗑','sm');del.onclick=()=>{STM.rules.splice(i,1);stmSave();stmPanel()};
  r1.append(sel,del);
  const fx=el('select');Object.keys(STM_FX).forEach(k=>{const o=el('option',STM_FX[k][0]+' '+STM_FX[k][1]);o.value=k;fx.append(o)});
  fx.value=r.fx;fx.onchange=()=>{r.fx=fx.value;stmSave()};
  const nn=el('select');[1,2,3].forEach(n=>{const o=el('option',n+(n>1?' fileiras':' fileira'));o.value=String(n);nn.append(o)});
  nn.value=String(r.n);nn.onchange=()=>{r.n=parseInt(nn.value,10);stmSave()};
  r2.style.marginTop='6px';r2.append(fx,nn);
  c.append(r1,ci,r2);return c;
}

function stmPanel(){
  cur='stm';$('mainc').hidden=true;$('pnl').hidden=false;$('ac').hidden=true;
  const pb=$('pb'),pt=$('pt');pb.textContent='';pb.className='';pt.textContent='🔴 Modo Stream';
  const wrap=el('div');wrap.addEventListener('keydown',e=>e.stopPropagation());
  // estado da live
  const b1=el('div',null,'stm-box'),stl=el('div',null,'stm-st');
  const stt=el('span',stmLive?'AO VIVO · termina em '+stmMS(stmEnd-Date.now()):stmSt==='wait'?'Conectando…':stmSt==='ended'?'Live encerrada':stmOn?'A live ainda não começou':'Modo Stream desligado');stt.id='stm-cd';
  stl.append(el('span',null,'stm-dot'+(stmLive?'':' off')),stt);b1.append(stl);
  if(stmMsg)b1.append(el('div',stmMsg,'stm-msg'));
  if(stmOn&&!stmLive)b1.append(el('div','A partida só começa depois que a live começar.','stm-msg'));
  // @ do TikTok
  const b2=el('div',null,'stm-box');b2.append(el('h3','@ do TikTok'));
  const ui=el('input');ui.placeholder='@seuusuario';ui.maxLength=25;ui.autocomplete='off';ui.autocapitalize='off';ui.value=STM.user?'@'+STM.user:'';
  ui.oninput=()=>{STM.user=ui.value.replace(/^@+/,'').replace(/[^A-Za-z0-9_.]/g,'').slice(0,24);stmSave()};
  b2.append(ui);
  // ações
  const b5=el('div');
  if(stmLive){
    const pj=el('button','▶ Jogar','stm-act');pj.onclick=start;
    const x=el('button','⏹ Encerrar live','sm stm-act');x.onclick=()=>stmFinish('Live encerrada por você.');
    b5.append(pj,x);
  }else{
    const g=el('button',stmSt==='wait'?'Conectando…':'🔴 Começar live','stm-act');g.disabled=stmSt==='wait';g.onclick=()=>stmStart(false);
    const t=el('button','🧪 Testar sem TikTok','sm stm-act');t.onclick=()=>stmStart(true);
    b5.append(g,t);
  }
  if(stmOn){const o=el('button','Sair do modo stream','sm stm-act');o.onclick=()=>{stmStop();stmPanel()};b5.append(o)}
  // presentes
  const b3=el('div',null,'stm-box');b3.append(el('h3','🎁 Presente → efeito'));
  STM.rules.forEach((r,i)=>b3.append(stmRuleEl(r,i)));
  const add=el('button','+ Adicionar presente','sm');
  add.onclick=()=>{const used=STM.rules.map(x=>x.g),p=STM_PRE.find(x=>!used.includes(x[0]));STM.rules.push({g:p?p[0]:'',fx:'coin',n:1});stmSave();stmPanel()};
  b3.append(add,el('div','Fileiras = quantas pistas recebem o efeito de uma vez (3 = todas). Barreira baixa = pular · alta = deslizar.','stm-msg'));
  // avançado
  const b4=el('div',null,'stm-box');b4.append(el('h3','⚙️ Avançado'),el('div','Duração da live (minutos)'));
  const di=el('input');di.type='number';di.min=1;di.max=180;di.value=STM.min;
  di.oninput=()=>{const v=parseInt(di.value,10);if(v>=1&&v<=180){STM.min=v;stmSave()}};
  const l2=el('div','Endereço da ponte do TikTok');l2.style.marginTop='10px';
  const wi=el('input');wi.value=STM.url;wi.autocapitalize='off';wi.oninput=()=>{STM.url=wi.value.trim();stmSave()};
  b4.append(di,l2,wi);
  wrap.append(b1,b2,b5,b3,b4);pb.append(wrap);
}
$('stbtn').onclick=stmPanel;
addEventListener('keydown',e=>{
  if(!stmLive||!stmDemo)return;
  const a=document.activeElement;if(a&&/^(INPUT|SELECT)$/.test(a.tagName))return;
  const i=parseInt(e.key,10);if(i>=1&&STM.rules[i-1])stmGift(STM.rules[i-1].g,1,'teste');
});
window.CTStream={gift:stmGift,status:()=>({ligado:stmOn,aoVivo:stmLive,restanteMs:stmLive?Math.max(0,stmEnd-Date.now()):0,usuario:STM.user,regras:STM.rules})};
})();
</script>
